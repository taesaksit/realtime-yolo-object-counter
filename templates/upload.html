{% extends "layout.html" %}
{% block content %}
<div class="bg-white p-8 rounded-lg shadow-md max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">สตรีมวิดีโอ Real-time ด้วย YOLO</h1>

    <form action="{{ url_for('upload_controller.upload_video') }}" method="POST" enctype="multipart/form-data"
        class="space-y-4">
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2" for="video_file">เลือกไฟล์วิดีโอ (MP4,
                AVI):</label>
            <input
                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded cursor-pointer"
                id="video_file" name="video_file" type="file">
        </div>
        <button class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition"
            type="submit">
            อัปโหลดและเริ่มสตรีม YOLO
        </button>
    </form>

    {% if error %}
    <div class="mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded text-center text-sm">
        {{ error }}
    </div>
    {% endif %}

    {% if filename %}
    <div class="mt-6 border-t pt-6 text-center">
        <h2 class="text-lg font-semibold mb-3 text-gray-700">กำลังประมวลผล Real-time Stream:</h2>
        <!-- ใช้แท็ก img รับสตรีมภาพแบบ MJPEG จาก Flask -->
        <img src="{{ url_for('upload_controller.video_feed', filename=filename) }}"
            class="w-full rounded shadow border" alt="YOLO Video Stream">
    </div>
    {% endif %}
</div>
{% endblock %}Í
