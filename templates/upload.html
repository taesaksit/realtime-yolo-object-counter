{% extends "layout.html" %}

{% block content %}

<div class="bg-white p-8 rounded-lg shadow-md max-w-4xl mx-auto">

    <h1 class="text-2xl font-bold mb-6 text-gray-800">
        YOLO Object Counter
    </h1>


    <!-- ================================================= -->
    <!-- Upload -->
    <!-- ================================================= -->

    <form action="{{ url_for('upload_controller.upload_video') }}" method="POST" enctype="multipart/form-data"
        class="mb-6">

        <input type="file" name="video_file" accept="video/*" required class="block w-full mb-4">

        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">
            Upload Video
        </button>

    </form>


    <!-- ================================================= -->
    <!-- Error -->
    <!-- ================================================= -->

    {% if error %}

    <div class="bg-red-100 text-red-700 p-4 rounded mb-4">
        {{ error }}
    </div>

    {% endif %}


    {% if filename %}


    <!-- ================================================= -->
    <!-- Video Preview + Drawing Canvas -->
    <!-- ================================================= -->

    <div id="draw-container" class="relative bg-black rounded overflow-hidden">

        <video id="video-preview" src="{{ url_for('static', filename='uploads/' + filename) }}" controls
            class="w-full block"></video>

        <canvas id="line-canvas" class="absolute inset-0 w-full h-full" style="cursor: crosshair;"></canvas>

    </div>

    <div id="line-info" class="mt-4 text-sm text-gray-600">
        วาดเส้นบนภาพเพื่อกำหนดจุดนับ
    </div>
    <!-- ================================================= -->
    <!-- Model Selection -->
    <!-- ================================================= -->

    <div class="mt-6">

        <label for="model-select" class="block text-sm font-medium text-gray-700 mb-2">
            YOLO Model
        </label>

        <select id="model-select"
            class="w-full border border-gray-300 rounded px-4 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">

            {% if models %}

            {% for model in models %}

            <option value="{{ model }}" {% if model==default_model %} selected {% endif %}>
                {{ model }}
            </option>

            {% endfor %}

            {% else %}

            <option value="">
                ไม่พบ model ในโฟลเดอร์ models
            </option>

            {% endif %}

        </select>



    </div>


    <!-- ================================================= -->
    <!-- Controls -->
    <!-- ================================================= -->

    <div class="flex gap-3 mt-4 flex-wrap">

        <button id="clear-line" type="button" class="bg-gray-500 hover:bg-gray-600 text-white px-5 py-2 rounded">
            Clear Line
        </button>


        <button id="start-counter" type="button" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded">
            Start Detection
        </button>


        <button id="stop-counter" type="button" class="bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded">
            Stop
        </button>

    </div>





    <!-- ================================================= -->
    <!-- YOLO Stream -->
    <!-- ================================================= -->

    <div id="stream-container" class="hidden relative bg-black rounded overflow-hidden mt-6">

        <img id="yolo-stream" class="w-full block" alt="YOLO Stream">

    </div>


    {% endif %}

</div>


{% if filename %}

<script>

    // ======================================================
    // Elements
    // ======================================================

    const video =
        document.getElementById(
            "video-preview"
        );

    const canvas =
        document.getElementById(
            "line-canvas"
        );

    const ctx =
        canvas.getContext("2d");

    const clearButton =
        document.getElementById(
            "clear-line"
        );

    const startButton =
        document.getElementById(
            "start-counter"
        );

    const stopButton =
        document.getElementById(
            "stop-counter"
        );

    const streamContainer =
        document.getElementById(
            "stream-container"
        );

    const streamImage =
        document.getElementById(
            "yolo-stream"
        );

    const lineInfo =
        document.getElementById(
            "line-info"
        );

    const modelSelect =
        document.getElementById(
            "model-select"
        );


    // ======================================================
    // Processing Resolution
    // ======================================================

    const PROCESS_WIDTH = 640;

    const PROCESS_HEIGHT = 360;


    // ======================================================
    // Drawing State
    // ======================================================

    let drawing = false;

    let startPoint = null;

    let endPoint = null;


    // ======================================================
    // Canvas Size
    // ======================================================

    function resizeCanvas() {

        canvas.width =
            PROCESS_WIDTH;

        canvas.height =
            PROCESS_HEIGHT;

        drawLine();

    }


    // ======================================================
    // Get Point
    // ======================================================

    function getPoint(event) {

        const rect =
            canvas.getBoundingClientRect();

        return {

            x: Math.round(

                (event.clientX - rect.left)
                * PROCESS_WIDTH
                / rect.width

            ),

            y: Math.round(

                (event.clientY - rect.top)
                * PROCESS_HEIGHT
                / rect.height

            )

        };

    }


    // ======================================================
    // Draw Line
    // ======================================================

    function drawLine() {

        ctx.clearRect(

            0,
            0,
            canvas.width,
            canvas.height

        );


        if (!startPoint || !endPoint) {

            return;

        }


        // Line

        ctx.beginPath();

        ctx.moveTo(
            startPoint.x,
            startPoint.y
        );

        ctx.lineTo(
            endPoint.x,
            endPoint.y
        );

        ctx.lineWidth = 5;

        ctx.strokeStyle = "red";

        ctx.stroke();


        // Start Point

        ctx.beginPath();

        ctx.arc(

            startPoint.x,
            startPoint.y,
            8,
            0,
            Math.PI * 2

        );

        ctx.fillStyle = "green";

        ctx.fill();


        // End Point

        ctx.beginPath();

        ctx.arc(

            endPoint.x,
            endPoint.y,
            8,
            0,
            Math.PI * 2

        );

        ctx.fillStyle = "blue";

        ctx.fill();


        // Coordinates

        lineInfo.innerText =

            `Line: (${startPoint.x}, ${startPoint.y}) → `
            + `(${endPoint.x}, ${endPoint.y})`;

    }


    // ======================================================
    // Pointer Down
    // ======================================================

    canvas.addEventListener(

        "pointerdown",

        function (event) {

            drawing = true;

            startPoint =
                getPoint(event);

            endPoint =
                startPoint;

            canvas.setPointerCapture(
                event.pointerId
            );

            drawLine();

        }

    );


    // ======================================================
    // Pointer Move
    // ======================================================

    canvas.addEventListener(

        "pointermove",

        function (event) {

            if (!drawing) {

                return;

            }

            endPoint =
                getPoint(event);

            drawLine();

        }

    );


    // ======================================================
    // Pointer Up
    // ======================================================

    canvas.addEventListener(

        "pointerup",

        function (event) {

            drawing = false;

            endPoint =
                getPoint(event);

            drawLine();

        }

    );


    // ======================================================
    // Clear Line
    // ======================================================

    clearButton.addEventListener(

        "click",

        function () {

            startPoint = null;

            endPoint = null;

            ctx.clearRect(

                0,
                0,
                canvas.width,
                canvas.height

            );

            lineInfo.innerText =
                "Draw a line on the video";

        }

    );


    // ======================================================
    // Start Detection
    // ======================================================

    startButton.addEventListener(

        "click",

        function () {

            if (!startPoint || !endPoint) {

                alert(
                    "กรุณาวาดเส้นก่อนเริ่ม Detection"
                );

                return;

            }


            // ------------------------------------------------
            // Check Model
            // ------------------------------------------------

            const selectedModel =
                modelSelect.value;


            if (!selectedModel) {

                alert(
                    "กรุณาเลือก YOLO Model"
                );

                return;

            }


            // ------------------------------------------------
            // Build Query Parameters
            // ------------------------------------------------

            const params =
                new URLSearchParams({

                    x1: startPoint.x,

                    y1: startPoint.y,

                    x2: endPoint.x,

                    y2: endPoint.y,

                    model: selectedModel

                });


            console.log(
                "Selected model:",
                selectedModel
            );


            // ------------------------------------------------
            // Stop Previous Stream
            // ------------------------------------------------

            streamImage.src = "";


            // ------------------------------------------------
            // Hide Original Video
            // ------------------------------------------------

            video.classList.add(
                "hidden"
            );

            canvas.classList.add(
                "hidden"
            );


            // ------------------------------------------------
            // Show YOLO Stream
            // ------------------------------------------------

            streamContainer.classList.remove(
                "hidden"
            );


            // ------------------------------------------------
            // Start MJPEG Stream
            // ------------------------------------------------

            streamImage.src =

                "{{ url_for('upload_controller.video_feed', filename=filename) }}"
                + "?"
                + params.toString();

        }

    );


    // ======================================================
    // Stop Detection
    // ======================================================

    stopButton.addEventListener(

        "click",

        function () {

            // Close MJPEG connection

            streamImage.src = "";


            // Hide stream

            streamContainer.classList.add(
                "hidden"
            );


            // Show original video

            video.classList.remove(
                "hidden"
            );

            canvas.classList.remove(
                "hidden"
            );

        }

    );


    // ======================================================
    // Video Loaded
    // ======================================================

    video.addEventListener(

        "loadedmetadata",

        resizeCanvas

    );


    // ======================================================
    // Window Resize
    // ======================================================

    window.addEventListener(

        "resize",

        function () {

            drawLine();

        }

    );

</script>

{% endif %}

{% endblock %}
